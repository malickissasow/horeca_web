name: Deploy Web to app.horecafrica.org (Hostinger FTP)

on:
  push:
    branches: [ main, production ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy-app-horecafrica:
    name: 🚀 Isolated Deploy to app.horecafrica.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://api.horecafrica.org/api

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: dist/index.html not found"
            exit 1
          fi
          echo "✅ Build successful! dist directory ready."

      - name: 📤 FTP Deploy to Hostinger via lftp
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 15;
            set net:max-retries 3;
            open ftp://92.113.24.18:21;
            user u208608546.app.horecafrica.org 'B5@9ll@c';
            mirror -R --delete --verbose --exclude-glob .git* ./dist /public_html;
            quit;
          "

      - name: Deployment Summary
        run: echo "🎉 Application deployed strictly to https://app.horecafrica.org"
